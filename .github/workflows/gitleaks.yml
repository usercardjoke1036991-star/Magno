name: Gitleaks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    name: Gitleaks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # El repositorio es privado. La acción oficial de Gitleaks pide licencia de pago.
      # El binario abierto no la pide y redacta el secreto en el registro.
      - name: Install Gitleaks
        run: |
          set -euo pipefail
          version=8.30.1
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${version}/gitleaks_${version}_linux_x64.tar.gz" -o /tmp/gitleaks.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks

      - name: Scan
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSH_BEFORE: ${{ github.event.before }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "pull_request" ]; then
            git fetch --no-tags origin "$BASE_REF"
            gitleaks detect --source . --redact --no-banner --exit-code 1 --log-opts="origin/${BASE_REF}..HEAD"
          elif [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            gitleaks detect --source . --redact --no-banner --exit-code 1
          elif [ -z "$PUSH_BEFORE" ] || [ "$PUSH_BEFORE" = "0000000000000000000000000000000000000000" ]; then
            gitleaks detect --source . --redact --no-banner --exit-code 1 --log-opts="-1"
          else
            gitleaks detect --source . --redact --no-banner --exit-code 1 --log-opts="${PUSH_BEFORE}..${GITHUB_SHA}"
          fi
