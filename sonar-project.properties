# Proyecto anclado en SonarCloud al repo público GitHub Magno.
# Token en SONAR_TOKEN, nunca en git. Local opcional: docker-compose.sonar.yml
sonar.projectKey=usercardjoke1036991-star_Magno
sonar.projectName=Magno
sonar.organization=usercardjoke1036991-star
sonar.projectVersion=1.0.2
sonar.sourceEncoding=UTF-8
sonar.python.version=3.11
sonar.sources=.
sonar.tests=test,forge-test
sonar.exclusions=**/node_modules/**,**/android/**,**/ios/**,**/artifacts/**,**/cache/**,**/forge-out/**,**/forge-cache/**,**/lib/forge-std/**,**/coverage/**,**/dist/**,**/.expo/**,**/typechain-types/**,**/stubs/**,**/.env,**/.env.*,**/keystore.properties,**/.scannerwork/**,**/i18n/**/*.json,**/scripts/patch-i18n-leftovers*.mjs,**/scripts/apply-i18n-leftovers.mjs
sonar.test.inclusions=test/**/*.js,test/**/*.ts,forge-test/**/*.sol
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.coverage.exclusions=test/**,forge-test/**,scripts/**,i18n/**,plugins/**,**/*.py
sonar.cpd.exclusions=i18n/locales/**,test/**,scripts/**,**/*.py
sonar.host.url=https://sonarcloud.io
sonar.scm.provider=git
sonar.typescript.tsconfigPath=tsconfig.sonar.json
# S2699: expectAmt envuelve chai.expect para bigint; sin esto Sonar marca el it() como vacío.
sonar.javascript.assertion.functions=expectAmt,assertNavInvariant
sonar.issue.ignore.multicriteria=e1,e2,e3,e4,e5
sonar.issue.ignore.multicriteria.e1.ruleKey=docker:S6471
sonar.issue.ignore.multicriteria.e1.resourceKey=**/Dockerfile.notify
# Automatic Analysis a veces ignora multicriteria en Docker; el USER final es node.
sonar.issue.ignore.multicriteria.e2.ruleKey=javascript:S5332
sonar.issue.ignore.multicriteria.e2.resourceKey=**/scripts/notify-worker.mjs
# gap-translations y locales: claves UI (passwordRuleMin), no credenciales.
sonar.issue.ignore.multicriteria.e3.ruleKey=secrets:S6703
sonar.issue.ignore.multicriteria.e3.resourceKey=**/i18n/**
sonar.issue.ignore.multicriteria.e4.ruleKey=javascript:S2068
sonar.issue.ignore.multicriteria.e4.resourceKey=**/i18n/**
sonar.issue.ignore.multicriteria.e5.ruleKey=javascript:S2068
sonar.issue.ignore.multicriteria.e5.resourceKey=**/scripts/patch-i18n*.mjs
